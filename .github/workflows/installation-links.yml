name: Installation links

on:
  push:
    branches: [main, dev]
    paths:
      - 'KittyClaw.Web/Components/OnboardingGate.razor'
      - 'KittyClaw.Web/Components/Pages/GlobalSettings.razor'
      - 'tools/*check_installation_links.py'
      - '.github/workflows/installation-links.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'KittyClaw.Web/Components/OnboardingGate.razor'
      - 'KittyClaw.Web/Components/Pages/GlobalSettings.razor'
      - 'tools/*check_installation_links.py'
      - '.github/workflows/installation-links.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test link checker offline
        run: python -m unittest discover -s tools -p test_check_installation_links.py -v
      - name: Check live installation links
        run: python tools/check_installation_links.py
