# Build + test on every push/PR. KittyClaw.ClaudeMock is built explicitly so the hermetic
# AgentRunner integration tests find the mock claude.exe instead of falling back to a real
# CLI (MockClaudeBinFixture walks the repo tree for a previously built binary).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-test:
    # ubuntu leg added after GitHub issue #2: the app crashed at startup on every
    # non-Windows host and the windows-only CI could not see it (32 tests fail on
    # macOS without the fix). Suggested by @FoodBreakPedro in PR #3.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Repository data policy
        shell: pwsh
        run: ./tools/Test-RepositoryDataPolicy.ps1 -SelfTest

      - name: Build
        run: |
          dotnet build KittyClaw.Web -c Release --nologo
          dotnet build KittyClaw.ClaudeMock -c Release --nologo
          dotnet build KittyClaw.Core.Tests -c Release --nologo

      - name: Test
        run: dotnet test KittyClaw.Core.Tests -c Release --no-build --nologo --logger "console;verbosity=minimal"
